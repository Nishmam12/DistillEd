name: inkflow
description: A note-taking app with no artificial limitations.
publish_to: 'none'
# Single source of truth for the app version.
# Format: <major>.<minor>.<patch>+<build>. The +<build> counter is
# auto-incremented on every push to main by the GitHub Actions workflow
# .github/workflows/version-bump.yml (no local setup needed for collaborators).
# Bump the semantic <major>.<minor>.<patch> by hand (and add a CHANGELOG.md
# entry) when a change warrants it. The running app reads this via
# package_info_plus, so the "About" screen always shows what's installed.
version: 2.0.0+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^2.5.1


  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.2.0

  # ── Dependency Injection ─────────────────────────────────
  get_it: ^7.7.0
  # ── Database (note metadata) ─────────────────────────────
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # ── App metadata (reads version/build from pubspec at runtime) ──
  package_info_plus: ^8.0.0

  # ── Stroke Rendering (Phase 1) ───────────────────────────
  perfect_freehand: ^2.5.1

  # ── PDF Rendering (Phase 4) ──────────────────────────────
  pdfx: ^2.6.0

  # ── Image Import (Phase 4) ───────────────────────────────
  image_picker: ^1.1.2
  image: ^4.2.0

  # ── Vector Shapes (Phase 5) ──────────────────────────────
  flutter_svg: ^2.3.0

  # ── Export & Share (Phase 2) ─────────────────────────────
  printing: ^5.13.1
  share_plus: 12.0.2
  file_picker: ^8.3.7
  pdf: ^3.12.0

  # ── AI (ported from main's summarize feature — see AI_PROGRESS.md
  #    and ai_prompts/INTEGRATION_ROADMAP.md for justifications).
  #    flutter_gemma pinned exact: the 1.x API is still moving.
  # PINNED below latest: 0.15.0 migrated the Android side from Java to Kotlin
  # and broke it — the Dart MethodChannel name ('..._recognizer') no longer
  # matches what the native Kotlin plugin registers ('..._recognition'), so
  # EVERY call (isModelDownloaded, recognize, etc.) throws
  # MissingPluginException on Android. Confirmed via source inspection
  # 2026-07-18; not yet fixed upstream. Re-check for a fixed release before
  # bumping past 0.14.2.
  google_mlkit_digital_ink_recognition: 0.14.2
  flutter_gemma: 1.3.0
  flutter_gemma_litertlm: 1.1.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5

  # ── Cloud Gateway client (Phase 3) — chosen over package:http for native
  #    streamed-response + CancelToken support (mid-stream interruption).
  dio: ^5.7.0

  # ── RAG embeddings (Phase 2, Loop 2.2) ───────────────────
  #    EmbeddingGemma 300M on the same LiteRT+FFI stack as the LLM above, so
  #    there is no second native inference runtime. NOT flutter_gemma_embedder
  #    (singular) — that package is DISCONTINUED.
  flutter_gemma_embeddings: ^1.0.2

  # ── Flashcard → Anki .apkg export ────────────────────────
  #    sqlite3 builds the Anki collection DB via native assets (no prebuilt
  #    libs; sqlite3_flutter_libs is EOL). archive zips it into the .apkg.
  #    Export degrades to directive-CSV if the native lib is ever unavailable.
  sqlite3: ^3.4.0
  archive: ^4.0.9

  # ── OCR for imported PDFs / photos ───────────────────────
  #    Image text recognition, as opposed to the stroke-based digital-ink
  #    recognition above. Held at 0.15.x deliberately: 0.16.0 needs
  #    google_mlkit_commons ^0.12.0, which cannot co-resolve with the pinned
  #    digital-ink 0.14.2 (commons ^0.11.0). 0.15.1 is also still the Java
  #    generation of the plugin, so it does NOT carry the Kotlin-migration
  #    MethodChannel mismatch that broke digital-ink 0.15.0 — verified
  #    2026-07-21: Dart and Android both use 'google_mlkit_text_recognizer'.
  #    Bumping past 0.15.x means unpinning digital ink first.
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code generation ───────────────────────────────────────
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

  # ── Testing ───────────────────────────────────────────────
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf