name: distill_ed
description: A note-taking app with no artificial limitations.
publish_to: 'none'
# Single source of truth for the app version.
# Format: <major>.<minor>.<patch>+<build>. The +<build> counter is
# auto-incremented on every push to main by the GitHub Actions workflow
# .github/workflows/version-bump.yml (no local setup needed for collaborators).
# Bump the semantic <major>.<minor>.<patch> by hand (and add a CHANGELOG.md
# entry) when a change warrants it. The running app reads this via
# package_info_plus, so the "About" screen always shows what's installed.
version: 5.0.0+30

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^3.4.3


  # ── Navigation ───────────────────────────────────────────
  go_router: ^18.0.2

  # ── Database (note metadata) ─────────────────────────────
  #    isar_community: the maintained fork of the Isar 3.x line. Plain isar was
  #    last released in April 2023, and its native library predates Android 16 KB
  #    page support, which Google Play requires (docs/TECH_MIGRATION_PLAN.md, phase 2).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.3

  # ── App metadata (reads version/build from pubspec at runtime) ──
  package_info_plus: ^10.2.2

  # ── Stroke Rendering (Phase 1) ───────────────────────────
  perfect_freehand: ^2.5.1

  # ── PDF Rendering (Phase 4) ──────────────────────────────
  pdfx: ^2.11.0

  # ── PDF text layer (docs/AI_PIPELINE_PLAN.md, item 8) ────
  #    Most lecture slides and papers already contain real text; PDFium reads it
  #    out exactly, so only pages without any (scans) need OCR or a vision
  #    model. pdfx has no text API, hence a second PDF engine. Used ONLY to read
  #    text — pdfx still renders — which keeps the change out of the page-image
  #    path. pdfium_flutter is the Flutter packaging of PDFium (Android binaries
  #    arrive through Dart native assets at build time). Needs Flutter >= 3.47.
  pdfrx_engine: ^0.6.1
  pdfium_flutter: ^0.3.1

  # ── Image Import (Phase 4) ───────────────────────────────
  image_picker: ^1.2.4
  image: ^4.2.0

  # ── Export & Share (Phase 2) ─────────────────────────────
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  pdf: ^3.12.0

  # ── AI (ported from main's summarize feature — see AI_PROGRESS.md
  #    and docs/AI_PIPELINE_PLAN.md for justifications).
  #    flutter_edge_ai pinned exact: the 2.x API is still moving.
  # Held at 0.14.2 until 0.16.0: the 0.15.0 Java→Kotlin migration made the Dart
  # MethodChannel name disagree with the one the native plugin registered, so
  # every call threw MissingPluginException on Android. 0.16.0 fixed it (Dart
  # and Kotlin now both say 'google_mlkit_digital_ink_recognizer' — verified in
  # the 0.16.1 sources) and 0.16.1 moves to google_mlkit_commons ^0.13.0, which
  # text recognition and entity extraction below share. Needs Dart ^3.12 /
  # Flutter >=3.44. Re-run the handwriting checks on a device after bumping.
  google_mlkit_digital_ink_recognition: ^0.16.1
  # 1.3.0 → 1.11.3 (docs/AI_PIPELINE_PLAN.md, item 19), the three packages in
  # lockstep. Renamed to flutter_edge_ai (docs/TECH_MIGRATION_PLAN.md, phase 1)
  # because flutter_gemma is discontinued; 1.11.4 was its last release. Brings
  # speech-to-text (flutter_edge_ai_speech, below), a per-encoder backend (the
  # vision encoder now defaults to the CPU, so the app asks for the GPU
  # explicitly — see EdgeAiRuntime), and activationDataType. Since flutter_gemma
  # 1.9.0 FlutterEdgeAi.initialize must be given the embedding tokenizers.
  # 2.1.1 fixes a crash while saving the active inference, STT or TTS model.
  # litertlm 1.10.0 requires flutter_edge_ai ^2.1.1 and moves to LiteRT-LM v0.18.0.
  flutter_edge_ai: 2.1.1
  flutter_edge_ai_litertlm: 1.10.0
  # Whisper / Moonshine on the same LiteRT runtime — lecture transcripts (item 14).
  flutter_edge_ai_speech: 0.5.4
  crypto: ^3.0.7
  shared_preferences: ^2.5.5

  # ── Cloud Gateway client (Phase 3) — chosen over package:http for native
  #    streamed-response + CancelToken support (mid-stream interruption).
  dio: ^5.7.0

  # ── RAG embeddings (Phase 2, Loop 2.2) ───────────────────
  #    EmbeddingGemma 300M on the same LiteRT+FFI stack as the LLM above, so
  #    there is no second native inference runtime. NOT flutter_gemma_embedder
  #    (singular) — that package is DISCONTINUED.
  flutter_edge_ai_embeddings: 2.2.2

  # ── Flashcard → Anki .apkg export ────────────────────────
  #    sqlite3 builds the Anki collection DB via native assets (no prebuilt
  #    libs; sqlite3_flutter_libs is EOL). archive zips it into the .apkg.
  #    Export degrades to directive-CSV if the native lib is ever unavailable.
  sqlite3: ^3.4.0
  archive: ^4.0.9

  # ── OCR for imported PDFs / photos ───────────────────────
  #    Image text recognition, as opposed to the stroke-based digital-ink
  #    recognition above. Moves with digital ink: both need
  #    google_mlkit_commons ^0.13.0, so they only resolve as a pair. Dart and
  #    Android both use 'google_mlkit_text_recognizer' (verified in 0.17.1).
  google_mlkit_text_recognition: ^0.17.1

  # ── Document scanner, entity extraction, language ID ─────
  #    Three more on-device ML Kit pieces (docs/AI_PIPELINE_PLAN.md items 15,
  #    16, 18). The scanner is Android-only and runs inside Google Play
  #    services (no camera permission, ~no app size); entity extraction finds
  #    the dates in notes for the Study Planner and downloads a small model on
  #    first use; language ID ships its model inside the library.
  google_mlkit_document_scanner: ^0.6.1
  google_mlkit_entity_extraction: ^0.17.1
  google_mlkit_language_id: ^0.15.1

  # ── Lecture audio recorded alongside ink (Tier 4.12) ─────
  #    Split deliberately: `record` captures, `just_audio` plays and seeks.
  #    Both sit behind AudioCapturePort / AudioPlaybackPort
  #    (features/audio/domain/audio_ports.dart), so everything above them is
  #    plugin-agnostic and unit-tested with fakes. Neither shares a transitive
  #    dependency with the pinned ML Kit plugins — verified by `pub get`
  #    resolving without touching google_mlkit_commons.
  record: ^7.1.1
  just_audio: ^0.10.6

  # ── Rendering the maths the tutor writes ─────────────────
  #    The models are instructed to emit LaTeX in $…$ / $$…$$ delimiters
  #    (features/ai/domain/tutor_voice.dart, kMathMarkup); without a renderer
  #    every derivative and fraction reached the student as raw \frac{}{}.
  #    flutter_math_fork, not flutter_math: the original was last published in
  #    2021 and does not build against a current Flutter, while the fork tracks
  #    it (this is the standard, actively-maintained continuation, not a random
  #    fork). Pure Dart — it ships the KaTeX font metrics as assets and adds no
  #    native code, so it cannot collide with the pinned ML Kit plugins above;
  #    `pub get` resolves it without moving any existing package (its one new
  #    transitive dependency is `tuple`).
  #    Failure mode is contained by design: MathText falls back to showing the
  #    raw LaTeX as plain text when a formula won't parse, so a malformed
  #    expression from a small model costs its own formula, never the answer.
  flutter_math_fork: ^0.7.3

  # ── Opening HuggingFace in the user's browser ────────────
  #    EmbeddingGemma is a GATED model, and HuggingFace only accepts a licence
  #    click from a browser — there is no API for it ("Requesting access can
  #    only be done from your browser", huggingface.co/docs/hub/models-gated).
  #    So the app has to hand the user off. Used via
  #    core/utils/external_links.dart, which prefers LaunchMode.inAppBrowserView
  #    (an Android Custom Tab) precisely because it SHARES the default browser's
  #    cookie jar — the user who just created a token is already signed in —
  #    while an embedded WebView would have its own jar and force a second
  #    login inside our app. 6.3.x matches the url_launcher_* platform shims
  #    already resolved transitively via share_plus.
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0
  # phosphor_flutter removed: 2.1.0 (latest) declares
  # `class PhosphorIconData extends IconData`, which cannot compile against
  # Flutter 3.44+ where IconData became a final class. Upstream fix PRs
  # (phosphor-icons/flutter #62/#63) are unmerged. The Regular style we use is
  # vendored as plain IconData constants in lib/core/icons/.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code generation ───────────────────────────────────────
  build_runner: ^2.15.1
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
          weight: 400
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf