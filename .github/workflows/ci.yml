name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Every 64-bit native library must be 16 KB page-size ready (Android 15+).
  android-native-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: tool/check_16kb_alignment.sh build/app/outputs/flutter-apk/app-debug.apk
      # The release APK is what ships, so its libraries are checked too.
      # No key.properties in CI, so this build uses the debug key; only the
      # native libraries are inspected here.
      - run: flutter build apk --release
      - run: tool/check_16kb_alignment.sh build/app/outputs/flutter-apk/app-release.apk

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ai-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/ai-gateway/requirements.lock
      # Test against the exact versions the Docker image ships, then the pinned dev tools.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker build .
      # Known-vulnerable pinned dependencies fail the build.
      - run: pip-audit --require-hashes -r requirements.lock
