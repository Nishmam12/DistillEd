name: CI

on:
  pull_request:
  push:
    branches: [main, tech-migration]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/ai-gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
